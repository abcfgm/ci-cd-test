name: Docker CI

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ci-cd-test:latest .

      - name: Tag Docker image
        run: |
          docker tag ci-cd-test:latest ghcr.io/abcfgm/ci-cd-test:latest
          docker tag ci-cd-test:latest ghcr.io/abcfgm/ci-cd-test:sha-${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/abcfgm/ci-cd-test:latest
          docker push ghcr.io/abcfgm/ci-cd-test:sha-${{ github.sha }}

      - name: Deploy image
        run: |
          IMAGE=ghcr.io/abcfgm/ci-cd-test:sha-${{ github.sha }}

          docker pull $IMAGE

          docker rm -f ci-cd-test-deploy 2>/dev/null || true

          docker run -d \
            --name ci-cd-test-deploy \
            -p 8080:8080 \
            $IMAGE

          sleep 2

          docker ps

          docker logs ci-cd-test-deploy

          docker rm -f ci-cd-test-deploy